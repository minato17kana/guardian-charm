<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guardian Charm</title>

<style>
body{
margin:0;
background:#0f172a;
font-family:sans-serif;
color:white;
text-align:center;
}

h1{
margin-top:30px;
}

#start{
margin-top:60px;
padding:20px 40px;
font-size:28px;
border-radius:20px;
background:#FFD700;
color:black;
font-weight:bold;
border:none;
}

#game{
display:none;
}

#court{
position:relative;
margin:20px auto;
width:350px;
height:500px;
background:#d68b47;
border-radius:20px;
overflow:hidden;
}

#goal{
position:absolute;
top:20px;
left:130px;
font-size:70px;
}

#ball{
position:absolute;
bottom:20px;
left:145px;
font-size:55px;
cursor:pointer;
transition:.4s;
}

#score{
font-size:35px;
margin-top:20px;
}

#timer{
font-size:25px;
}
</style>
</head>

<body>

<h1>🏀 Guardian Charm</h1>

<h2>杜真</h2>

<button id="start">TAP HERE</button>

<div id="game">

<h2 id="timer">30</h2>

<div id="score">0点</div>
<div id="message"></div>
  
<div id="court">

<div id="goal">🧺</div>

<div id="ball">🏀</div>

</div>

</div>

<script>

let score=0;
let time=30;

const start=document.getElementById("start");
const game=document.getElementById("game");
const ball=document.getElementById("ball");

start.onclick=()=>{

start.style.display="none";
game.style.display="block";

const countdown=setInterval(()=>{

time--;

document.getElementById("timer").innerHTML=time;

if(time==0){

clearInterval(countdown);

let message="";

if(score>=20){
message="🌟LEGEND！\n\n杜真なら最高のプレーができる！🏀❤️";
}else if(score>=10){
message="✨MVP！\n\n今日も自分を信じて頑張ってね！";
}else{
message="🍀最後まで諦めない気持ちが一番！";
}

alert(message);

}

},1000);

};

ball.onclick=()=>{

score++;

document.getElementById("score").innerHTML=score+"点";

ball.style.bottom="380px";

setTimeout(()=>{
ball.style.bottom="20px";
},350);

}

</script>

</body>
</html>
