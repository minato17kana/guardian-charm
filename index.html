<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardian Charm</title>

<style>
body{
    margin:0;
    background:#0f172a;
    color:#fff;
    font-family:sans-serif;
    text-align:center;
}

h1{
    margin-top:20px;
}

#score{
    font-size:30px;
    margin:10px;
}

#court{
    width:320px;
    height:450px;
    background:#d68b47;
    margin:20px auto;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    border:5px solid white;
}

#goal{
    position:absolute;
    top:25px;
    left:120px;
    font-size:70px;
}

#ball{
    position:absolute;
    left:130px;
    bottom:20px;
    font-size:60px;
    cursor:pointer;
    user-select:none;
}

#card{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    justify-content:center;
    align-items:center;
}

#letter{
    background:white;
    color:#333;
    width:300px;
    padding:25px;
    border-radius:20px;
    white-space:pre-line;
}

button{
    margin-top:20px;
    padding:10px 25px;
    border:none;
    border-radius:10px;
    background:#ff69b4;
    color:white;
    font-size:16px;
}
</style>
</head>

<body>

<h1>🏀 Guardian Charm</h1>

<h2>杜真へ❤️</h2>

<p>🏀を3回タップすると応援メッセージが届くよ</p>

<div id="score">0 / 3</div>

<div id="court">
    <div id="goal">🧺</div>
    <div id="ball">🏀</div>
</div>

<div id="card">
    <div id="letter">
        <div id="text"></div>
        <button onclick="closeCard()">閉じる</button>
    </div>
</div>

<script>

const ball=document.getElementById("ball");
const score=document.getElementById("score");
const card=document.getElementById("card");
const text=document.getElementById("text");

const messages=[

`🏀 杜真くん♡

今日も試合お疲れさま☺️

どんな結果でも
頑張る杜真くんが一番かっこいいよ❤️

ずっと応援してるよ♡

KANAより`,

`💕

自分を信じてプレーしてね😊

私はいつでも杜真くんの味方だよ❤️`,

`🍀

緊張したら深呼吸☺️

楽しんできてね🏀💕`,

`❤️

今日も一番かっこいい杜真くん✨

応援してるよ！`,

`🏆

試合が終わったら
いっぱい褒めさせてね🥰`,

`💛

大好き♡

今日もファイト🏀`,

`🌈

笑顔でプレーする杜真くんが
一番素敵☺️❤️`,

`💖

無理しすぎないでね🥺

いつでも応援してるよ💕`,

`✨

頑張る姿を見るたびに
もっと好きになるよ❤️`,

`❤️

杜真くん♡

今日も最高のプレーを！

大好き☺️🏀`

];

let point=0;

ball.addEventListener("click",()=>{

    point++;

    score.innerHTML=point+" / 3";

    ball.animate([
        {transform:"translateY(0)"},
        {transform:"translateY(-280px)"},
        {transform:"translateY(0)"}
    ],{
        duration:500
    });

    if(point>=3){

        point=0;

        setTimeout(()=>{

            score.innerHTML="0 / 3";

            text.innerHTML=messages[Math.floor(Math.random()*messages.length)];

            card.style.display="flex";

        },500);

    }

});

function closeCard(){
    card.style.display="none";
}

</script>

</body>
</html>
