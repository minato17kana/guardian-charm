<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guardian Charm</title>

<style>
body{
margin:0;
background:#0f172a;
font-family:sans-serif;
color:white;
text-align:center;
}

h1{
margin-top:30px;
}

#start{
margin-top:60px;
padding:20px 40px;
font-size:28px;
border-radius:20px;
background:#FFD700;
color:black;
font-weight:bold;
border:none;
}

#game{
display:none;
}

#court{
position:relative;
margin:20px auto;
width:350px;
height:500px;
background:#d68b47;
border-radius:20px;
overflow:hidden;
}

#goal{
position:absolute;
top:20px;
left:130px;
font-size:70px;
}

#ball{
position:absolute;
bottom:20px;
left:145px;
font-size:55px;
cursor:pointer;
transition:.4s;
}

#score{
font-size:35px;
margin-top:20px;
}

#timer{
font-size:25px;
}
</style>
</head>

<body>
<h1>🏀 Guardian Charm</h1>

<h2>杜真へ</h2>

<p>3点決めると応援メッセージが届くよ❤️</p>

<div id="score">0 / 3</div>

<div id="court">
    <div id="goal">🧺</div>
    <div id="ball">🏀</div>
</div>

</body>
</html>
